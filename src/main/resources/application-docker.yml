spring:
  application:
    name: ink-ms-auth
  
  datasource:
    url: jdbc:mysql://mysql:3306/auth_ms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 3001

jwt:
  secret: inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512
  expiration: 86400000

app:
  password-reset:
    mail-enabled: true
    expose-token-in-response: false
    token-expiry-hours: 24

users:
  service:
    url: http://users-service:3002

security:
  basic:
    enabled: false

logging:
  level:
    com.inklusport.auth: DEBUG