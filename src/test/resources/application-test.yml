spring:
  datasource:
    url: jdbc:h2:mem:auth_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

jwt:
  secret: test-jwt-secret-must-be-long-enough-for-tests-and-hs256
  expiration-ms: 3600000

app:
  password-reset:
    token-expiry-minutes: 60
